name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli

      # Decodes the base64 GH secret into ./google-services.json before
      # prebuild reads android.googleServicesFile from app.json. The file
      # is gitignored, so this is the only place it appears in a build.
      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing. Push notifications won't work."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          # sanity check — the file must at least parse as JSON
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))"
          echo "google-services.json restored ($(wc -c < google-services.json) bytes)"

      - name: Generate Android Project
        run: npx expo prebuild --platform android --non-interactive

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Knot.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Knot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knot-APK
          path: Knot.apk
